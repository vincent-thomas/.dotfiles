# route plain cargo through mr boxington (mbx) for shared build caching
wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }

[settings]
lockfile = true
minimum_release_age = "0"

[tools]
# langs
bun = "latest"
rust = "latest"
mr-boxington = "latest"

# harnesses
codex = "latest"

# cli tools
fd = "latest"
ripgrep = "latest"
fzf = "latest"
bat = "latest"

# dev
neovim = "latest"
pitchfork = "latest"
tmux = "latest"

[env]
EDITOR="nvim"
